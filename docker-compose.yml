services:
  mongodb:
    image: mongo:7.0
    container_name: datasolutech_mongo
    restart: always
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      ETL_USER: ${ETL_USER}
      ETL_PASSWORD: ${ETL_PASSWORD}
      ANALYST_USER: ${ANALYST_USER}
      ANALYST_PASSWORD: ${ANALYST_PASSWORD}
    volumes:
      - mongo_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d
    networks:
      - datasolutech_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  migration:
    build: .
    container_name: datasolutech_migration
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
     MONGO_HOST: mongodb
     MONGO_PORT: 27017
     MONGO_USER: ${ETL_USER}
     MONGO_PASS: ${ETL_PASSWORD}
     ANALYST_USER: ${ANALYST_USER}
     ANALYST_PASSWORD: ${ANALYST_PASSWORD}
    networks:
      - datasolutech_net

volumes:
  mongo_data:

networks:
  datasolutech_net:
    name: datasolutech_net